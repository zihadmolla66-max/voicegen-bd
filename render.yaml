services:
  - type: web
    name: voicegen-bd
    runtime: python

    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"

      - key: BOT_TOKEN
        sync: false

      - key: WEBHOOK_SECRET
        sync: false

      - key: WEBHOOK_URL
        sync: false

      - key: PORT
        value: "10000"
